name: Native runtime
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsqlite3-dev
      - name: Strict native build
        run: cc -std=c11 -O2 -Wall -Wextra -Werror runtime/kiln.c -lm -o /tmp/kiln
      - name: Native test suite
        run: make test
      - name: Install target smoke test
        run: make install-check
