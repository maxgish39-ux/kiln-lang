# Syntax highlighting for MINT (.mint files) in the micro editor.
# Install: copy this file to ~/.config/micro/syntax/mint.yaml

filetype: mint

detect:
    filename: "\\.mint$"

rules:
    - statement: "\\b(let|fun|class|return|if|else|while|for|in|break|continue|import|as|try|catch|throw|print)\\b"
    - statement: "\\b(and|or|not)\\b"
    - constant.bool: "\\b(true|false|null)\\b"
    - identifier.class: "\\b(this)\\b"
    - constant.number: "\\b[0-9]+(\\.[0-9]+)?\\b"
    - symbol.operator: "(=>|==|!=|<=|>=|[-+*/%=<>!])"
    - type: "\\b(init)\\b"
    - constant.string:
        start: "\""
        end: "\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
    - comment:
        start: "#"
        end: "$"
        rules: []
